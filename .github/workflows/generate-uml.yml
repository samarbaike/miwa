name: Auto-Generate Full Stack UML Diagrams

on:
  push:
    branches:
      - main  # Triggers when code is pushed to main
  workflow_dispatch: # Allows manual trigger from the Actions tab
  
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-uml-main
  cancel-in-progress: false

jobs:
  build-diagrams:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Environments
      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (Backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Initialize the documentation file
      - name: Initialize Documentation File
        run: |
          echo "# Codebase Architecture & UML Diagrams" > ARCHITECTURE.md
          echo "This file is automatically generated by GitHub Actions on every push to main." >> ARCHITECTURE.md

      # 4. Generate Frontend Diagram (JS/TS)
      - name: Generate Frontend Architecture (TypeScript/JavaScript)
        run: |
          npm install -g madge
          echo -e "\n## Frontend Architecture (Module Dependencies)" >> ARCHITECTURE.md
          echo '```mermaid' >> ARCHITECTURE.md
          # Replace './frontend/src' with the actual path to your frontend source files
          madge --image mermaid ./frontend/src >> ARCHITECTURE.md || echo "graph TD; Error[Could not parse Frontend files];" >> ARCHITECTURE.md
          echo '```' >> ARCHITECTURE.md

      # 5. Generate Backend Diagram (Python)
      - name: Generate Backend UML (Python Classes)
        run: |
          pip install pylint
          echo -e "\n## Backend UML Class Diagram" >> ARCHITECTURE.md
          echo '```mermaid' >> ARCHITECTURE.md
          # pyreverse creates a 'classes.mmd' file. 
          # Replace './backend' with the actual path to your Python backend files.
          pyreverse -o mmd -p backend_classes ./app
          
          # Append the generated Mermaid code into our markdown document
          if [ -f classes_backend_classes.mmd ]; then
            cat classes_backend_classes.mmd >> ARCHITECTURE.md
          else
            echo "graph TD; Error[Could not parse Python files or no classes found];" >> ARCHITECTURE.md
          fi
          echo '```' >> ARCHITECTURE.md

      # 6. Create or update UML documentation pull request
      - name: Create UML Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update generated UML diagrams"
          branch: automation/update-uml
          base: main
          delete-branch: true
          add-paths: ARCHITECTURE.md
          title: "docs: Update frontend and backend UML diagrams"
          body: |
            ## Automated architecture update

            This pull request was generated by GitHub Actions.

            It updates `ARCHITECTURE.md` with:
            - Frontend module dependency diagrams
            - Backend Python class diagrams

            Review the generated diagrams before merging.
